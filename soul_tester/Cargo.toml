[package]
name = "soul_tester"
version = "0.1.0"
edition = "2024"

[features]
error_backtrace = ["soul_utils/error_backtrace"]

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
ast_run = { version = "0.1.0", path = "../soul_ast/ast_run" }
ast_model = { version = "0.1.0", path = "../soul_ast/ast_model" }
soul_tokenizer = { version = "0.1.0", path = "../soul_tokenizer" }
ast_parser = { version = "0.1.0", path = "../soul_ast/ast_parser" }
soul_name_resolver = { version = "0.1.0", path = "../soul_ast/soul_name_resolver" }
soul_utils = { version = "0.1.0", path = "../soul_utils", default-features = false }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "pipeline"
harness = false
