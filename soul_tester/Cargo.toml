[package]
name = "soul_tester"
version = "0.1.0"
edition = "2024"

[profile.release-performance]
inherits = "release"
opt-level = 3                 # Maximum optimization for speed
lto = "fat"                   # Most aggressive link-time optimization
codegen-units = 1             # Single codegen unit = more optimization opportunities
panic = "abort"               # Smaller/faster panic handling (no unwind tables)
overflow-checks = false       # Disable arithmetic overflow checks in release
strip = "none"                # Keep symbols if you need profiling; use "debuginfo" or true to strip
debug = 1                     # Minimal debug info for profiling (optional)
incremental = false           # Disable incremental compilation for max optimization

[features]
error_backtrace = ["soul_utils/error_backtrace"]

[dependencies]
anyhow = "1.0.102"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
ast_run = { version = "0.1.0", path = "../soul_ast/ast_run" }
ast_model = { version = "0.1.0", path = "../soul_ast/ast_model" }
soul_tokenizer = { version = "0.1.0", path = "../soul_tokenizer" }
ast_parser = { version = "0.1.0", path = "../soul_ast/ast_parser" }
soul_utils = { version = "0.1.0", path = "../soul_utils", default-features = false }
